    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">

<body>
    <div class="container">
        <div class="bg-primary rounded-right pr-3">
            <div class="bg-success rounded-right pr-3">
                <nav class="navbar navbar-expand-lg navbar-light bg-light rounded-right">
                    <div class="container-fluid">
                        <a href="#" class="navbar-brand">
                            <i class="fas fa-graduation-cap mr-2"></i> TESCo
                        </a>
                        <button class="navbar-toggler d-lg-none ml-auto"
                            type="button"
                            data-toggle="modal"
                            data-target="#menuLateral"
                            aria-label="Abrir menú">
                            <span class="navbar-toggler-icon"></span>

                            </li>

                                <a href="#" class="nav-link">
                                    <i class="fas fa-bell"></i>
                                </a>

        <div class="modal-dialog m-0 h-100 w-75 mw-100" role="document">
            <div class="modal-content h-100 bg-dark text-white rounded-0">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Investigadores TESCo
                    </h5>
                    <button type="button" class="close text-white"
                        data-dismiss="modal" aria-label="cerrar">

                </div>
                <div class="modal-body d-flex flex-column">
                    <div>
                        <small class="text-muted text-uppercase d-block mb-2">

                        </small>
                        <nav class="nav flex-column">
                            <a href="#" class="nav-link text-white bg-primary rounded">
                                <i class="fas fa-chalkboard-teacher mr-2"></i> Resúmen
                            </a>
                            <a href="#" class="nav-link text-white">
                                <i class="fas fa-user mr-2"></i> Mi perfil
                            </a>
                            <a href="#" class="nav-link text-white">

                            </a>
                            <a href="#" class="nav-link text-white">

                            </a>

                            </a>

                            </a>
                        </nav>

                    <div class="mt-auto">
                        <hr>
                        <nav class="nav flex-column">
                            <a href="#" class="nav-link text-white">
