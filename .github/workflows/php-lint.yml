name: PHP syntax validation
on:
  push:
    paths:
      - 'includes/**/*.php'
      - 'profesores/**/*.php'
      - 'Landing/**/*.php'
      - 'Alumnos/**/*.php'
      - 'Admin/**/*.php'
      - 'tests/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'includes/**/*.php'
      - 'profesores/**/*.php'
      - 'Landing/**/*.php'
      - 'Alumnos/**/*.php'
      - 'Admin/**/*.php'
      - 'tests/**/*.php'
      - '.github/workflows/php-lint.yml'
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          find includes profesores Landing Alumnos Admin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Render nine teacher views with a mocked SQLSRV connection
        run: |
          for page in index.php perfil.php productividad.php proyectos.php publicaciones.php congresos.php titulacion.php convocatorias.php postulaciones.php; do
            php tests/profesor_smoke.php "$page"
          done
      - name: Verify professor authentication and role isolation
        run: |
          php tests/profesor_smoke.php index.php uid12
          for mode in alumno inactivo sin_perfil; do
            output=$(php tests/profesor_smoke.php index.php "$mode")
            case "$output" in
              *"Acceso exclusivo al rol PROFESOR activo"*|*"perfil docente activo asociado"*) ;;
              *) echo "Unexpected access outcome: $mode -> $output"; exit 1 ;;
            esac
          done
      - name: Landing smoke test con SQLSRV simulado
        run: php tests/landing_smoke.php
      - name: Render student pages and authorized teacher CV (mock SQLSRV)
        run: |
          for page in index.php perfil.php postulaciones.php cv.php cv-postulante.php; do
            php tests/alumno_smoke.php "$page"
          done
      - name: Render administrative dashboard and modules (mock SQLSRV)
        run: |
          for page in index.php perfil.php usuarios.php convocatorias.php postulaciones.php habilidades.php produccion.php; do
            php tests/admin_smoke.php "$page"
          done
      - name: Validate critical ADMIN authorization invariants
        run: php tests/admin_logic.php
